<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brendi's Bachelorette | Dublin Getaway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --periwinkle: #7684c3;
            --periwinkle-light: #f0f2fa;
            --gold: #d4af37;
            --gold-light: #f9f6ec;
            --white: #ffffff;
            --text-dark: #333a56;
            --text-muted: #6b728e;
            --border-fine: 1px solid rgba(210, 175, 55, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--white);
            color: var(--text-dark);
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            line-height: 1.7;
            padding-bottom: 80px;
        }

        .gold-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            max-width: 200px;
        }
        .gold-divider::before, .gold-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold), transparent);
        }
        .gold-divider span {
            color: var(--gold);
            font-size: 12px;
            margin: 0 10px;
        }

        header {
            text-align: center;
            padding: 60px 20px 40px 20px;
            background: linear-gradient(to bottom, var(--gold-light), var(--white));
        }

        .logo-container {
            max-width: 280px;
            margin: 0 auto 20px auto;
        }

        .logo-container img {
            width: 100%;
            height: auto;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--periwinkle);
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        header p {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            color: var(--periwinkle);
            font-size: 1.8rem;
            font-weight: 400;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .section-block {
            margin-bottom: 60px;
        }

        .logistics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .luxury-card {
            background-color: var(--white);
            border: var(--border-fine);
            border-radius: 4px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(118, 132, 195, 0.05);
            transition: transform 0.3s ease;
        }

        .luxury-card:hover {
            transform: translateY(-3px);
        }

        .luxury-card h3 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1rem;
            color: var(--text-dark);
            margin-bottom: 15px;
        }

        .luxury-card p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .btn-luxury {
            display: inline-block;
            background-color: var(--periwinkle);
            color: var(--white);
            padding: 12px 25px;
            border-radius: 2px;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            font-weight: 400;
            margin-top: 15px;
            border: 1px solid var(--periwinkle);
            transition: all 0.3s ease;
        }

        .btn-luxury:hover {
            background-color: transparent;
            color: var(--periwinkle);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .gallery-item {
            position: relative;
            height: 240px;
            border-radius: 2px;
            overflow: hidden;
            border: var(--border-fine);
            background-color: #f7f7f7;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .gallery-item:hover img {
            transform: scale(1.04);
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .timeline-event {
            display: flex;
            background-color: var(--white);
            border: var(--border-fine);
            border-radius: 2px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(118, 132, 195, 0.03);
        }

        .event-img {
            width: 260px;
            min-width: 260px;
            background-size: cover;
            background-position: center;
        }

        .event-details {
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .event-details h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.35rem;
            color: var(--periwinkle);
            font-weight: 400;
            margin-bottom: 10px;
        }

        .event-details p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .timeline-event {
                flex-direction: column;
            }
            .event-img {
                width: 100%;
                height: 200px;
            }
            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
